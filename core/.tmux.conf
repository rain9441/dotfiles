# Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Switch panes with Ctrl-hjkl (no prefix, no wrap)
bind -n C-h if -F '#{pane_at_left}'   '' 'select-pane -L'
bind -n C-j if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind -n C-k if -F '#{pane_at_top}'    '' 'select-pane -U'
bind -n C-l if -F '#{pane_at_right}'  '' 'select-pane -R'

# Swap to the last-active window with Ctrl-o
bind -n C-o last-window

# Mouse support
set -g mouse on

# Pane border labels on top edge
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

bind -n C-u copy-mode -u
bind -n C-d send-keys -X half-page-down
